name: Dedicated Server Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "Contents/mods/**"
      - ".github/scripts/server-smoke.sh"
      - ".github/workflows/server-smoke.yml"
  pull_request:
    paths:
      - "Contents/mods/**"
      - ".github/scripts/server-smoke.sh"
      - ".github/workflows/server-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-smoke:
    name: Load mod on dedicated server
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install SteamCMD
        run: |
          sudo dpkg --add-architecture i386
          echo "steam steam/question select I AGREE" | sudo debconf-set-selections
          echo "steam steam/license note ''" | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes steamcmd
      - name: Install Project Zomboid dedicated server
        run: |
          install_dir="$RUNNER_TEMP/pz-server"
          # A fresh SteamCMD installation self-updates and restarts. Warm it
          # up in a separate invocation so app metadata is available next time.
          steamcmd +login anonymous +quit || true

          for attempt in 1 2 3; do
            echo "SteamCMD install attempt $attempt of 3"
            if steamcmd \
              +force_install_dir "$install_dir" \
              +login anonymous \
              +app_update 380870 validate \
              +quit; then
              break
            fi

            if [[ "$attempt" == 3 ]]; then
              echo "SteamCMD failed to install Project Zomboid dedicated server after 3 attempts" >&2
              exit 1
            fi
            sleep 20
          done

          if [[ ! -x "$install_dir/start-server.sh" ]]; then
            echo "SteamCMD completed without installing start-server.sh into $install_dir" >&2
            exit 1
          fi
      - name: Start server with this mod enabled
        run: bash .github/scripts/server-smoke.sh "$RUNNER_TEMP/pz-server"
